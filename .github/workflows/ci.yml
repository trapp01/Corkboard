name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The desktop package's unit tests and typecheck need Electron's types, not its binary; packaging is not run here.
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  test:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @corkboard/web exec playwright install --with-deps chromium
      - run: pnpm --filter @corkboard/web e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: packages/web/test-results
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t corkboard .
      - name: Start the server and wait for it to report healthy
        run: |
          docker run -d --name corkboard -p 8422:8422 corkboard
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8422/api/health; then exit 0; fi
            sleep 1
          done
          docker logs corkboard
          exit 1

  publish:
    name: Publish image
    # Only a push to main that passed every other job becomes `latest`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, e2e, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/trapp01/corkboard:latest
            ghcr.io/trapp01/corkboard:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/trapp01/Corkboard
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    name: Publish Mac app
    # Only a push to main that passed every other job replaces the build the desktop app updates itself from.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, e2e, docker]
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @corkboard/web build
      - run: pnpm --filter @corkboard/desktop run package --mac zip --arm64 -c.extraMetadata.version=$VERSION
      - name: Write latest.json beside the zip
        working-directory: packages/desktop/out
        run: |
          mv "Corkboard-$VERSION-arm64-mac.zip" Corkboard-arm64-mac.zip
          sha256=$(shasum -a 256 Corkboard-arm64-mac.zip | cut -d ' ' -f 1)
          size=$(stat -f %z Corkboard-arm64-mac.zip)
          printf '{"version":"%s","file":"Corkboard-arm64-mac.zip","sha256":"%s","size":%s}\n' "$VERSION" "$sha256" "$size" > latest.json
          cat latest.json
      # The app reads releases/download/latest/latest.json; between the delete and the create it finds nothing and tries again later.
      - name: Replace the "latest" release
        working-directory: packages/desktop/out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Corkboard-arm64-mac.zip latest.json \
            --target "$GITHUB_SHA" \
            --title "Latest build ($VERSION)" \
            --notes "Built from $GITHUB_SHA. The Mac app (Apple silicon) updates itself from this release. The build is not signed with an Apple Developer ID; packages/desktop/README.md says how to open it the first time."
